spring.application.name=taxdesk

# --- DB ---
# 계좌 금융소득·상담예약을 JPA 로 다룬다. 소유자 조건을 쿼리 안에 넣기 위해서다 (findByOwnerIdAndYear)
spring.datasource.url=jdbc:h2:mem:taxdesk;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# --- OpenAI ---
spring.ai.openai.api-key=${OPENAI_API_KEY_SKALA1}
# 주 답변 모델만 gpt-4o 다. mini 는 근거를 받고도 고객 숫자 대신 법령 문장을 베껴
# "비과세 한도금액까지는…" 같은 일반론으로 답한다(CA-10). 프롬프트로는 안 잡혔다.
# 라우터·폴백은 아래에서 mini 로 남긴다 — 분류는 mini 로 충분하고 호출은 거기가 더 많다.
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.0
spring.ai.openai.embedding.options.model=text-embedding-3-small

# --- 세법 상수 (Phase 4) · 2026 귀속 기준 ---
# 세법이 바뀌면 코드가 아니라 이 아래가 바뀐다.
# 2026-08-20 소득세법 원문(제21221호, 시행 2026.7.1) 전건 대조 완료. docs/raw_law/ 참조.
#    검증 실험: docs/EXPERIMENTS.md E11
# 종합과세기준금액 2천만원 — 소득세법 §14③6호 ("2천만원 이하"가 분리과세이므로 판정은 '초과')
taxdesk.threshold-amount=20000000
# 배당가산율 — 소득세법 §17③ "100분의 10". 2023·2024 개정으로 11%→10%. 옛 자료에 11%가 많으니 주의.
taxdesk.gross-up-rate=0.10
# 원천징수세율 14% — 소득세법 §129①1라(이자) · 2나(배당)
taxdesk.separate-tax-rate=0.14
# 개인지방소득세 = 소득세 결정세액의 10% (지방세법)
taxdesk.local-tax-rate=0.10

# 누진세율표 — 과세표준 상한 / 세율 / 누진공제. (소득세법 §55 · 2026 귀속 · 2026-08-20 대조 완료)
# up-to=0 은 "상한 없음"(최고 구간)을 뜻한다.
# RAG 문서 04번의 표와 같은 값이어야 한다 — 골든셋이 둘의 일치를 검증한다.
taxdesk.brackets[0].up-to=14000000
taxdesk.brackets[0].rate=0.06
taxdesk.brackets[0].deduction=0
taxdesk.brackets[1].up-to=50000000
taxdesk.brackets[1].rate=0.15
taxdesk.brackets[1].deduction=1260000
taxdesk.brackets[2].up-to=88000000
taxdesk.brackets[2].rate=0.24
taxdesk.brackets[2].deduction=5760000
taxdesk.brackets[3].up-to=150000000
taxdesk.brackets[3].rate=0.35
taxdesk.brackets[3].deduction=15440000
taxdesk.brackets[4].up-to=300000000
taxdesk.brackets[4].rate=0.38
taxdesk.brackets[4].deduction=19940000
taxdesk.brackets[5].up-to=500000000
taxdesk.brackets[5].rate=0.40
taxdesk.brackets[5].deduction=25940000
taxdesk.brackets[6].up-to=1000000000
taxdesk.brackets[6].rate=0.42
taxdesk.brackets[6].deduction=35940000
taxdesk.brackets[7].up-to=0
taxdesk.brackets[7].rate=0.45
taxdesk.brackets[7].deduction=65940000

# --- RAG (Phase 2) ---
taxdesk.docs-location=classpath:/tax-docs/
taxdesk.rag-top-k=4
taxdesk.rag-similarity-threshold=0.25
# 이 점수에도 못 미치면 "상담 범위 밖" 질문으로 본다
taxdesk.out-of-scope-threshold=0.30

# --- 라우팅 · 폴백 (Phase 3 · 8) ---
taxdesk.router-model=gpt-4o-mini
taxdesk.fallback-model=gpt-4o-mini

# --- 안전 장치 (Phase 7) ---
# 프롬프트가 아니라 코드가 강제하는 값들
taxdesk.max-input-length=2000
taxdesk.memory-window=20
# 100 = 메모리 저장보다 앞(정상) · 250 = 뒤(실습용, 차단된 문장이 기억에 남는다)
taxdesk.safety-order=100

# 실습용 계정. 실제 서비스라면 당연히 여기에 두지 않는다.
# 계정 하나가 계산 엔진의 분기 하나를 담당한다 — 겸하면 실패 원인을 분리할 수 없다.
#   antman    분리과세 종결          (calculateTax 를 안 부르는 경로)
#   isabu     비과세·분리과세 제외   (제외가 판정을 뒤집는다: 2,600만 → 1,700만)
#   jonber   비교과세 ①<②          (다른 종합소득 0 · 추가납부 0원)
#   richman   비교과세 ①>② + Gross-up 전액 대상 (사업소득 1.5억)
#   americano 해외배당 위주 → Gross-up 대상 0   (외국납부세액공제는 안내만)
# 시드 금액과 기대 세액: docs/QUESTIONS.md §1
taxdesk.users.antman=pass1
taxdesk.users.isabu=pass2
taxdesk.users.jonber=pass3
taxdesk.users.richman=pass4
taxdesk.users.americano=pass5
taxdesk.admins.admin=admin

# --- Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- 관찰 (Phase 8) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=taxdesk
# 프롬프트가 관찰 로그로 새지 않게 한다
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.client.observations.log-prompt=false

# --- 감사 로그 (Phase 7) ---
logging.level.AI_TOOL_AUDIT=INFO
logging.level.AI_AUDIT=INFO
